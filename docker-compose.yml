# Local Postgres for Syncro development:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: syncro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syncro
    ports:
      - "5432:5432"
    volumes:
      - syncro-pgdata:/var/lib/postgresql/data
volumes:
  syncro-pgdata:
